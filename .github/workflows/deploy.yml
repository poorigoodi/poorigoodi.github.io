name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # مراحل بیلد پروژه (مثلاً نصب وابستگی‌ها و ساخت فایل‌های خروجی)

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # یا مسیر پوشه خروجی پروژه شما (مثل build)

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
